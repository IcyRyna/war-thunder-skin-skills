interface:

  display_name: "战雷痛涂·Akamywek 风格"

  short_description: "无人物喷气机涂装：炭灰、指定色场与双色渐变、中轴白形、原生 UV 和字组适配"

  default_prompt: "使用 $war-thunder-style-akamywek 为我指定的战雷喷气机制作涂装：使用 1.16，保留已认可的无人物色块与翼尾布局，统一 #333334 炭灰，采用已认可的中轴白形及我指定的签名色。先完成无人物基本布局；我要求无人物时以此为成品，按我指定的双色或渐变覆盖完整色场，文字按机身宽度内收。人物放置尚未验证，只有我另行要求时才研究。"
