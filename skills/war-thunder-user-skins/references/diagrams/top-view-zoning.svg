<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Microsoft YaHei, Arial, sans-serif">
  <title>自绘示意：双垂尾喷气机俯视分区与三值大形</title>
  <rect width="960" height="600" fill="#f2f2f2"/>
  <g transform="translate(250,20)">
    <!-- base airframe silhouette (dark neutral) -->
    <polygon points="230,0 246,90 262,200 270,240 450,370 450,410 290,380 300,470 380,540 380,560 270,545 250,575 210,575 190,545 80,560 80,540 160,470 170,380 10,410 10,370 190,240 198,200 214,90" fill="#424347"/>
    <!-- deep spine channel -->
    <polygon points="222,150 238,150 246,560 214,560" fill="#212421"/>
    <!-- signature parent bands: shoulder to wing, symmetric -->
    <polygon points="226,110 216,110 190,240 120,330 40,390 60,396 140,350 206,270" fill="#ff1663"/>
    <polygon points="234,110 244,110 270,240 340,330 420,390 400,396 320,350 254,270" fill="#ff1663"/>
    <polygon points="170,470 110,520 100,540 180,500" fill="#ff1663"/>
    <polygon points="290,470 350,520 360,540 280,500" fill="#ff1663"/>
    <!-- white sequence on the spine -->
    <polygon points="222,250 210,262 210,290 222,280" fill="#e7e7e7"/><polygon points="222,296 210,306 210,330 222,322" fill="#e7e7e7"/>
    <polygon points="238,250 250,262 250,290 238,280" fill="#e7e7e7"/><polygon points="238,296 250,306 250,330 238,322" fill="#e7e7e7"/>
    <!-- character zones on the wing panels -->
    <polygon points="200,290 150,340 70,390 170,380 190,330" fill="none" stroke="#f2f2f2" stroke-width="2" stroke-dasharray="6 5"/>
    <polygon points="260,290 310,340 390,390 290,380 270,330" fill="none" stroke="#f2f2f2" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <g font-size="14" fill="#202020">
    <text x="24" y="60" font-weight="bold">三值先行（只看大形）</text>
    <text x="24" y="84">深中性底 50–65%</text>
    <text x="24" y="104">一个签名色 20–35%</text>
    <text x="24" y="124">最高反差强调色 3–8%</text>
    <text x="24" y="144">点缀 ≤2%（可无）</text>
    <text x="24" y="190" font-weight="bold">机背主轴</text>
    <text x="24" y="212">对称深色通道＋一个</text>
    <text x="24" y="232">白色序列（琴键／爪／V）</text>
    <text x="24" y="278" font-weight="bold">肩部母形</text>
    <text x="24" y="300">从座舱后出发，沿边条</text>
    <text x="24" y="320">转入前缘，延续到平尾</text>
    <text x="740" y="330" font-weight="bold">翼面人物区（虚线）</text>
    <text x="740" y="352">人物轮廓≥翼面 60%</text>
    <text x="740" y="372">在深场上，边缘渐隐</text>
    <text x="740" y="418" font-weight="bold">角度族</text>
    <text x="740" y="440">只用机轴、前缘后掠、</text>
    <text x="740" y="460">后缘三种方向</text>
    <text x="740" y="506" font-weight="bold">垂尾（侧视）</text>
    <text x="740" y="528">外侧紧凑肖像，内侧色场</text>
    <text x="24" y="586" fill="#606060">示意不是固定模板：形状回到当前机型 UV 与可见面，迁移的是比例与主次。</text>
  </g>
</svg>
